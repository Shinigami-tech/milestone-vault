[package]
name = "tusdc"
description = "Testnet-only demo stablecoin (NEP-141) for Milestone Vault. Anyone can mint up to 1,000 tUSDC per call. Not real money."
version = "0.1.0"
edition = "2024"
repository = "https://github.com/Shinigami-tech/milestone-vault"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
